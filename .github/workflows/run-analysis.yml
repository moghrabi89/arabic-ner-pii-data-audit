name: Run Arabic NER PII Dataset Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-lock.txt"
      - ".github/workflows/run-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dataset-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Syntax gate
        run: python -m py_compile src/*.py

      - name: Unit-test gate
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end dataset audit
        id: analysis
        continue-on-error: true
        run: |
          set -o pipefail
          python -m src.main 2>&1 | tee audit.log

      - name: Upload reproducibility artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-ner-pii-dataset-audit
          path: |
            results/
            figures/
            reports/
            audit.log
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated evidence
        if: steps.analysis.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results figures reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "analysis: generate reproducible dataset audit outputs [skip ci]"
            git push
          fi

      - name: Record failure for readback
        if: steps.analysis.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The reproducible dataset audit workflow failed."
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Tail of audit.log:"
            echo
            echo '~~~'
            tail -n 120 audit.log 2>/dev/null || true
            echo '~~~'
          } > failure.md
          gh issue create --title "Dataset audit workflow failure" --body-file failure.md || true

      - name: Fail workflow if analysis failed
        if: steps.analysis.outcome == 'failure'
        run: exit 1
